#
# Worker variant for a per-model KV state agent that lives outside any DGD
# (agg-state-agent.yaml) and a node-local Guard that is not a sidecar. The
# Guard socket is read from a hostPath directory; this worker only waits for it.
# Render with envsubst the same way as agg-memory-service.yaml.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  annotations:
    nvidia.com/dynamo-discovery-backend: kubernetes
    nvidia.com/dynamo-kube-discovery-mode: container
  name: vllm-agg-kvcr-guard-daemonset
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - env:
          - name: DYN_ROUTER_MODE
            value: kv
          image: ${DYNAMO_VLLM_IMAGE}
          name: main
    replicas: 1
    type: frontend
  - name: worker
    podTemplate:
      spec:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component
                  operator: In
                  values:
                  - worker
                - key: nvidia.com/dynamo-graph-deployment-name
                  operator: In
                  values:
                  - vllm-agg-kvcr-guard-daemonset
              topologyKey: kubernetes.io/hostname
        containers:
        - args:
          - |
            set -euo pipefail

            kv_transfer_config=$(
              python3 - <<'PY'
            import json
            import os

            def cache_owner_id():
                raw_slot = os.environ["KVCR_CACHE_SLOT"]
                raw_count = os.environ["KVCR_CACHE_SLOT_COUNT"]
                if not raw_slot.isdecimal() or not raw_count.isdecimal():
                    raise SystemExit("KVCR cache slot and count must be decimal integers")
                slot = int(raw_slot)
                slot_count = int(raw_count)
                if slot_count <= 0 or slot >= slot_count:
                    raise SystemExit(
                        f"KVCR cache slot {slot} is outside [0, {slot_count})"
                    )
                return (
                    "01010101010101010101010101010101:"
                    "02020202020202020202020202020202/"
                    f"0303030303030303/{slot:032x}"
                )

            print(json.dumps({
                "kv_connector": "OffloadingConnector",
                "kv_role": "kv_both",
                "kv_connector_extra_config": {
                    "cpu_bytes_to_use": 2147483648,
                    "spec_name": "TieringOffloadingSpec",
                    "self_describing_kv_events": True,
                    "dynamo_state_agent": {
                        "raw_advertise_host": os.environ["POD_IP"],
                        "cache_owner_ids": {"0": cache_owner_id()},
                    },
                    "secondary_tiers": [{
                        "type": "kvcr",
                        "kvcr_service_socket_path": "/run/kvcr/qwen3-0.6b/memory.sock",
                        "compatibility_digest": "${DYNAMO_KVCR_COMPATIBILITY_DIGEST}",
                        "router_capabilities": ["router_hint"],
                        "control_host": "0.0.0.0",
                        "control_ports": [23280],
                        "control_advertise_host": os.environ["POD_IP"],
                        "enable_telemetry": True,
                    }],
                },
            }))
            PY
            )
            exec python3 -m dynamo.vllm \
              --model Qwen/Qwen3-0.6B \
              --kv-state-endpoint kvcr-qwen3-0-6b/backend/generate \
              --kv-transfer-config "$kv_transfer_config" \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:23080","enable_kv_cache_events":true}'
          command:
          - /bin/bash
          - -c
          env:
          - name: CONTAINER_NAME
            value: main
          - name: DYN_KUBE_DISCOVERY_MODE
            value: container
          - name: DYN_SYSTEM_PORT
            value: "9090"
          - name: DYN_KV_STATE_AGENT_HOST_DISCOVERY_TIMEOUT_SECS
            value: "300"
          - name: KVCR_CACHE_SLOT
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['grove.io/podclique-pod-index']
          - name: KVCR_CACHE_SLOT_COUNT
            value: "2"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PYTHONHASHSEED
            value: "0"
          - name: UCX_TLS
            value: rc_x,cuda
          - name: UCX_NET_DEVICES
            value: ${DYNAMO_UCX_NET_DEVICES}
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${DYNAMO_VLLM_IMAGE}
          name: main
          resources:
            limits:
              ${DYNAMO_RDMA_RESOURCE}: "1"
              nvidia.com/gpu: "1"
            requests:
              ${DYNAMO_RDMA_RESOURCE}: "1"
              ephemeral-storage: 2Gi
              nvidia.com/gpu: "1"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          volumeMounts:
          - mountPath: /run/kvcr/qwen3-0.6b
            name: kvcr-socket
          - mountPath: /dev/shm/kvcr/qwen3-0.6b
            name: kvcr-memory
          workingDir: /workspace/examples/backends/vllm
        initContainers:
        - args:
          - |
            import socket, sys, time
            path = "/run/kvcr/qwen3-0.6b/memory.sock"
            while True:
                s = socket.socket(socket.AF_UNIX)
                s.settimeout(1)
                try:
                    s.connect(path)
                    break
                except OSError as error:
                    print(f"waiting for the KVCR Guard socket {path}: {error}", file=sys.stderr, flush=True)
                    time.sleep(2)
                finally:
                    s.close()
          command:
          - python3
          - -c
          image: ${DYNAMO_VLLM_IMAGE}
          name: wait-for-guard
          volumeMounts:
          - mountPath: /run/kvcr/qwen3-0.6b
            name: kvcr-socket
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        volumes:
        - hostPath:
            path: /run/kvcr/qwen3-0.6b
            type: Directory
          name: kvcr-socket
        - hostPath:
            path: /dev/shm/kvcr/qwen3-0.6b
            type: Directory
          name: kvcr-memory
    replicas: 2
    type: worker
