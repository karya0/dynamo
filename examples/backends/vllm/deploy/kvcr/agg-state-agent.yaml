#
# Per-model KV state agent that lives outside any DynamoGraphDeployment. Workers
# and routers in every DGD of the model reach it through the Dynamo namespace
# below (workers pass --kv-state-endpoint kvcr-qwen3-0-6b/backend/generate).
# Apply into the same Kubernetes namespace as the DGDs.
#
# --max-slots (KVCR_STATE_AGENT_MAX_SLOTS, set before envsubst) is a lifetime
# budget, not a live count: slots are durable and are not reclaimed when a node
# goes away. Set it to (number of GPU nodes the workers may ever use) x (Guards
# per node). If it is too small the host rejects new owners; watch
# kv_state_agent_capacity_rejected_total.
#
# Exactly one replica must exist per Dynamo namespace: workers fail closed when
# they find zero or more than one live host. Recreate avoids two hosts during a
# rollout.
#
# The ServiceAccount and Role mirror the per-DGD "-k8s-service-discovery" Role
# the operator creates, because the Kubernetes discovery backend needs the same
# access (read pods/endpoints/endpointslices, write DynamoWorkerMetadata CRs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kvcr-qwen3-0-6b-state-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kvcr-qwen3-0-6b-state-agent
rules:
- apiGroups: [""]
  resources: ["endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamoworkermetadatas"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kvcr-qwen3-0-6b-state-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kvcr-qwen3-0-6b-state-agent
subjects:
- kind: ServiceAccount
  name: kvcr-qwen3-0-6b-state-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvcr-qwen3-0-6b-state-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kvcr-qwen3-0-6b-state-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvcr-qwen3-0-6b-state-agent
        nvidia.com/dynamo-component: kv_state_agent
        nvidia.com/dynamo-discovery-backend: kubernetes
        nvidia.com/dynamo-discovery-enabled: "true"
        nvidia.com/dynamo-namespace: kvcr-qwen3-0-6b
    spec:
      containers:
      - args:
        - -m
        - dynamo.kv_state_agent
        - --max-slots
        - "${KVCR_STATE_AGENT_MAX_SLOTS}"
        command:
        - python3
        env:
        - name: CONTAINER_NAME
          value: main
        - name: DYN_DISCOVERY_BACKEND
          value: kubernetes
        - name: DYN_KUBE_DISCOVERY_MODE
          value: container
        - name: DYN_NAMESPACE
          value: kvcr-qwen3-0-6b
        - name: DYN_SYSTEM_PORT
          value: "9091"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        image: ${DYNAMO_VLLM_IMAGE}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: 9091
          periodSeconds: 5
          timeoutSeconds: 4
        name: main
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: 9091
          periodSeconds: 5
          timeoutSeconds: 4
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /live
            port: 9091
          periodSeconds: 2
          timeoutSeconds: 4
      serviceAccountName: kvcr-qwen3-0-6b-state-agent
