# Experimental template. Render every variable and review before deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${GAAS_NAME}-guard
  namespace: ${GAAS_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${GAAS_NAME}-guard
  namespace: ${GAAS_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${GAAS_NAME}-guard
  namespace: ${GAAS_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${GAAS_NAME}-guard
    namespace: ${GAAS_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${GAAS_NAME}-guard
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ${GAAS_NAME}-guard
  namespace: ${GAAS_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: ${GAAS_NAME}-guard
  template:
    metadata:
      labels:
        app: ${GAAS_NAME}-guard
    spec:
      serviceAccountName: ${GAAS_NAME}-guard
      nodeSelector:
        kubernetes.io/hostname: ${GAAS_NODE}
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: nvcrimagepullsecret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: ${GAAS_IMAGE}
          command: [kvcr-node-service]
          args:
            - --socket-root
            - ${GAAS_SOCKET_ROOT}
            - --namespace
            - $(POD_NAMESPACE)
            - --node-name
            - $(NODE_NAME)
            - --manager-id
            - ${GAAS_NAME}
            - --holder-image
            - ${GAAS_IMAGE}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: CUDA_VISIBLE_DEVICES
              value: ""
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: socket-directory
              mountPath: /node-shm
      volumes:
        - name: socket-directory
          hostPath:
            path: /dev/shm
            type: Directory
