# Experimental template. Render every variable and review before deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${GAAS_NAME}-guard
  namespace: "${GAAS_NAMESPACE}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${GAAS_NAME}-guard
  namespace: "${GAAS_NAMESPACE}"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${GAAS_NAME}-guard
  namespace: "${GAAS_NAMESPACE}"
subjects:
  - kind: ServiceAccount
    name: ${GAAS_NAME}-guard
    namespace: "${GAAS_NAMESPACE}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${GAAS_NAME}-guard
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ${GAAS_NAME}-guard
  namespace: "${GAAS_NAMESPACE}"
spec:
  selector:
    matchLabels:
      app: ${GAAS_NAME}-guard
  template:
    metadata:
      labels:
        app: ${GAAS_NAME}-guard
    spec:
      serviceAccountName: ${GAAS_NAME}-guard
      nodeSelector:
        kubernetes.io/hostname: "${GAAS_NODE}"
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: nvcrimagepullsecret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: prepare-dirs
          image: ${GAAS_IMAGE}
          command:
            - sh
            - -c
            - mkdir -p ${GAAS_SOCKET_ROOT}/pools ${GAAS_SOCKET_ROOT}/slots && chown -R 1000:1000 ${GAAS_SOCKET_ROOT} && chmod 0700 ${GAAS_SOCKET_ROOT}/slots
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: socket-directory
              mountPath: /node-shm
      containers:
        - name: supervisor
          image: ${GAAS_IMAGE}
          command: [kvcr-service]
          args:
            - --socket-path
            - ${GAAS_SOCKET_ROOT}/service.sock
            - --pool-dir
            - ${GAAS_SOCKET_ROOT}/pools
            - --compatibility-digest
            - "${GAAS_COMPATIBILITY_DIGEST}"
            - --holder-image
            - ${GAAS_IMAGE}
            - --slot-root
            - ${GAAS_SOCKET_ROOT}/slots
            - --manager-id
            - "${GAAS_NAME}"
            - --disable-hugepages
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KVCR_LOG_LEVEL
              value: DEBUG
            - name: KVCR_ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: CUDA_VISIBLE_DEVICES
              value: ""
          # The supervisor starts with zero Guards and allocates no pool at
          # startup; a Guard and its holder are created when a worker first
          # claims, for the slot index the worker names, sized by the claim.
          # This limit is the supervisor container's own memory, not a Guard
          # or pool budget; nothing but the node bounds /dev/shm.
          resources:
            requests:
              cpu: 200m
              memory: "${GAAS_SUPERVISOR_MEMORY}"
            limits:
              cpu: "1"
              memory: "${GAAS_SUPERVISOR_MEMORY}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [IPC_LOCK]
          volumeMounts:
            - name: socket-directory
              mountPath: /node-shm
      volumes:
        - name: socket-directory
          hostPath:
            path: /dev/shm
            type: Directory
